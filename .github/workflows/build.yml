name: Build MusoVisuals Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Clone Fabric Template
        run: |
          git clone https://github.com/FabricMC/fabric-example-mod.git temp
          cp -r temp/* .
          rm -rf temp

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Mod
        run: ./gradlew build

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: MusoVisuals-1.21.1
          path: build/libs/*.jar
