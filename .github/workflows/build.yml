    private void renderCompassHUD(DrawContext context, TextRenderer tr, MinecraftClient client) {
        int cx = context.getScaledWindowWidth() / 2;
        int y = 10;
        float yaw = MathHelper.wrapDegrees(client.player.getYaw());
        context.fill(cx - 50, y, cx + 50, y + 15, 0xB00F1118);
        context.fill(cx - 50, y, cx + 50, y + 1, 0xFFFF9800);
        String heading = (yaw >= -45 && yaw < 45) ? "S" : (yaw >= 45 && yaw < 135) ? "W" : (yaw >= -135 && yaw < -45) ? "E" : "N";
        context.drawText(tr, heading + " (" + (int) yaw + "°)", cx - tr.getWidth(heading) / 2 - 8, y + 4, 0xFFFFD700, true);
    }

    private void renderArmorHUD(DrawContext context, TextRenderer tr, MinecraftClient client) {
        int y = context.getScaledWindowHeight() - 70;
        int x = 10;
        for (EquipmentSlot slot : new EquipmentSlot[]{EquipmentSlot.HEAD, EquipmentSlot.CHEST, EquipmentSlot.LEGS, EquipmentSlot.FEET}) {
            ItemStack stack = client.player.getEquippedStack(slot);
            if (!stack.isEmpty()) {
                context.drawItem(stack, x, y);
                int dur = stack.getMaxDamage() - stack.getDamage();
                int percent = (dur * 100) / stack.getMaxDamage();
                int col = percent > 50 ? 0xFF55FF55 : (percent > 20 ? 0xFFFFFF55 : 0xFFFF5555);
                context.drawText(tr, percent + "%", x + 20, y + 4, col, true);
                y -= 18;
            }
        }
    }

