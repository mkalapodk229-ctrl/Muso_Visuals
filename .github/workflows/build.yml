    private void drawKey(DrawContext context, TextRenderer tr, String key, int x, int y, int w, int h, boolean pressed) {
        context.fill(x, y, x + w, y + h, pressed ? 0xFFFF9800 : 0xD00F1118);
        context.drawText(tr, key, x + (w - tr.getWidth(key)) / 2 + 1, y + (h - 8) / 2, pressed ? 0xFF000000 : 0xFFFFFFFF, false);
    }

