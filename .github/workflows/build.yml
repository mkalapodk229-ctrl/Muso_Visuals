    // Счетчики
    public static final Map<String, Integer> totemPops = new HashMap<>();
    public static int comboHits = 0;
    public static int maxComboSession = 0;
    public static long lastComboTime = System.currentTimeMillis();
    public static double currentBPS = 0.0;
    public static double lastHitDistance = 0.0;
    public static double maxHitDistanceSession = 0.0;
    public static int hitDisplayTimer = 0;
    public static int hitMarkerTimer = 0;

    public static int pearlCooldownTicks = 0;
    private static final List<String> localKillFeed = new ArrayList<>();
    private static final List<Notification> notifications = new ArrayList<>();

    public static int sessionKills = 0;
    public static int sessionDeaths = 0;
    public static long sessionStartTime = System.currentTimeMillis();
    public static long lastMovementTime = System.currentTimeMillis();
    public static boolean isAFK = false;

    private static int leftClicks = 0;
    private static int rightClicks = 0;
    private static int spacePresses = 0;
    private static long lastClickReset = System.currentTimeMillis();

    @Override
    public void onInitializeClient() {
        System.out.println("==================================================================");
        System.out.println("  ⚔️ MUSOWORLD VISUALS 100+ MEGA EDITION (110 MODULES) LOADED ⚔️  ");
        System.out.println("==================================================================");

        // Регистрация клавиш
        toggleSprintKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                "key.musoworld.togglesprint", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_V, "category.musoworld.100plus"
        ));
        zoomKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                "key.musoworld.zoom", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_C, "category.musoworld.100plus"
        ));
        timeChangerKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                "key.musoworld.timechanger", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_F6, "category.musoworld.100plus"
        ));
        fullbrightKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                "key.musoworld.fullbright", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_R, "category.musoworld.100plus"
        ));
        antiSpamKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                "key.musoworld.antispam", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_H, "category.musoworld.100plus"
        ));

        // Модули фильтра чата и авто-GG
        ClientReceiveMessageEvents.GAME.register((message, overlay) -> {
            String text = message.getString();

            if (enableAntiSpam && (text.contains("donate") || text.contains("купи") || text.contains("скидки"))) {
                // Фильтр рекламных сообщений
            }

            if (enableAutoGG && (text.contains("победил") || text.contains("Winner") || text.contains("Game Over"))) {
                MinecraftClient.getInstance().execute(() -> {
                    if (MinecraftClient.getInstance().player != null) {
                        MinecraftClient.getInstance().player.networkHandler.sendChatMessage("GG");
                        addNotification("§6Auto-GG: §fОтправлено 'GG' в чат!");
                    }
                });
            }
        });

        // Главный цикл обновлений
        ClientTickEvents.END_CLIENT_TICK.register(client -> {
            if (client.player == null || client.world == null) return;

            // Расчет BPS
            Vec3d vel = client.player.getVelocity();
            currentBPS = Math.sqrt(vel.x * vel.x + vel.z * vel.z) * 20.0;

            // Контроль AFK
            if (vel.lengthSquared() > 0.001) {
                lastMovementTime = System.currentTimeMillis();
                isAFK = false;
            } else if (System.currentTimeMillis() - lastMovementTime > 60000) {
                isAFK = true;
            }

            if (pearlCooldownTicks > 0) pearlCooldownTicks--;

            if (System.currentTimeMillis() - lastComboTime > 2500) {
                comboHits = 0;
            }

            // Auto-Sprint
            while (toggleSprintKey.wasPressed()) {
                isSprintToggled = !isSprintToggled;
                addNotification("Auto-Sprint: " + (isSprintToggled ? "§aВКЛ" : "§cВЫКЛ"));
            }
            if (isSprintToggled && !client.player.isSneaking() && client.options.forwardKey.isPressed()) {
                client.player.setSprinting(true);
            }

            // Fullbright
            while (fullbrightKey.wasPressed()) {
                enableFullbright = !enableFullbright;
                addNotification("Fullbright: " + (enableFullbright ? "§aВКЛ" : "§cВЫКЛ"));
            }
            if (enableFullbright && client.options != null) {
                client.options.getGamma().setValue(100.0);
            }

            // Time Changer
            while (timeChangerKey.wasPressed()) {
                enableCustomTime = !enableCustomTime;
                addNotification("Смена Времени: " + (enableCustomTime ? "§aЗакат" : "§cСерверное"));
            }
            if (enableCustomTime) {
                client.world.setTimeOfDay(clientTimeOverride);
            }

            // Anti-Spam
            while (antiSpamKey.wasPressed()) {
                enableAntiSpam = !enableAntiSpam;
                addNotification("Фильтр Чата: " + (enableAntiSpam ? "§aАКТИВЕН" : "§cОТКЛ"));
            }

            enableSmoothZoom = zoomKey.isPressed();

            if (System.currentTimeMillis() - lastClickReset >= 1000) {
                leftClicks = 0; rightClicks = 0;
                lastClickReset = System.currentTimeMillis();
            }

            if (client.options.jumpKey.isPressed()) {
                spacePresses++;
            }

            if (client.crosshairTarget instanceof EntityHitResult ehr) {
                Vec3d eyePos = client.player.getEyePos();
                lastHitDistance = eyePos.distanceTo(ehr.getPos());
                if (lastHitDistance > maxHitDistanceSession) {
                    maxHitDistanceSession = lastHitDistance;
                }
                hitDisplayTimer = 40;
            }

            if (hitDisplayTimer > 0) hitDisplayTimer--;
            if (hitMarkerTimer > 0) hitMarkerTimer--;

            if (enableParticleTrail && client.player.getVelocity().lengthSquared() > 0.003) {
                DefaultParticleType particle = getParticleType();
                client.world.addParticle(
                        particle,
                        client.player.getX() + (Math.random() - 0.5) * 0.4,
                        client.player.getY() + 0.1,
                        client.player.getZ() + (Math.random() - 0.5) * 0.4,
                        0, 0.03, 0
                );
            }

            notifications.removeIf(Notification::isExpired);
        });

        // 2D РЕНДЕРИНГ И ИНТЕРФЕЙСЫ
        HudRenderCallback.EVENT.register((drawContext, tickDelta) -> {
            MinecraftClient client = MinecraftClient.getInstance();
            if (client.player == null || client.options.hudHidden) return;

            TextRenderer tr = client.textRenderer;

            if (enableLowHpVignette && client.player.getHealth() < 6.0f) renderLowHpVignette(drawContext, client);
            if (enableWatermark) renderWatermark(drawContext, tr, client);
            if (enableSpeedometer) renderSpeedometer(drawContext, tr, client);
            if (enableComboCounter && comboHits > 0) renderComboCounter(drawContext, tr, client);
            if (enableNetherCoords) renderNetherCoords(drawContext, tr, client);
            if (enableSystemStats) renderSystemStats(drawContext, tr, client);
            if (enableCompassHUD) renderCompassHUD(drawContext, tr, client);
            if (enableArmorHUD) renderArmorHUD(drawContext, tr, client);
            if (enablePotionHUD) renderPotionHUD(drawContext, tr, client);
            if (enableKeystrokes) renderKeystrokes(drawContext, tr, client);
            if (enableTargetHUD && client.targetedEntity != null) renderTargetHUD(drawContext, tr, client);
            if (enableReachDisplay && hitDisplayTimer > 0) renderReachHUD(drawContext, tr, client);
            if (enableSessionStats) renderSessionStats(drawContext, tr, client);
            if (enablePearlCooldown && pearlCooldownTicks > 0) renderPearlCooldownHUD(drawContext, tr, client);
            if (enableEntityCounter) renderEntityCounter(drawContext, tr, client);
            if (enableArrowCounter) renderArrowCounter(drawContext, tr, client);
            if (enableRadarHUD) renderRadarHUD(drawContext, tr, client);
            if (enableInventoryHUD) renderInventoryHUD(drawContext, tr, client);
            if (enableCustomCrosshair) renderCustomCrosshair(drawContext, client);
            if (hitMarkerTimer > 0) renderHitMarker(drawContext, client);
            if (enableKillFeed) renderKillFeed(drawContext, tr);
            if (enableHandItemIndicator) renderHandItemIndicator(drawContext, tr, client);

            renderNotifications(drawContext, tr, client);
        });

        // 3D КОСМЕТИКА И ТАЙМЕРЫ
        WorldRenderEvents.AFTER_ENTITIES.register(context -> {
            MinecraftClient client = MinecraftClient.getInstance();
            if (client.player == null || client.world == null) return;

            MatrixStack matrices = context.matrixStack();

            if (enableTNTTimer) {
                for (net.minecraft.entity.Entity entity : client.world.getEntities()) {
                    if (entity instanceof TntEntity tnt) {
                        renderTNTFuse(matrices, tnt, context.camera().getPos(), client.textRenderer);
                    }
                }
            }

            for (PlayerEntity player : client.world.getPlayers()) {
                if (player.isAlive()) {
                    matrices.push();
                    double px = MathHelper.lerp(context.tickDelta(), player.lastRenderX, player.getX()) - context.camera().getPos().x;
                    double py = MathHelper.lerp(context.tickDelta(), player.lastRenderY, player.getY()) - context.camera().getPos().y;
                    double pz = MathHelper.lerp(context.tickDelta(), player.lastRenderZ, player.getZ()) - context.camera().getPos().z;
                    matrices.translate(px, py, pz);

                    if (enableHalo) renderHalo(player);
                    if (enableWings) renderWings(player);

                    matrices.pop();
                }
            }
        });
    }

    private DefaultParticleType getParticleType() {
        return switch (activeTrailType) {
            case "FLAME" -> ParticleTypes.FLAME;
            case "HEARTS" -> ParticleTypes.HEART;
            case "END_ROD" -> ParticleTypes.END_ROD;
            default -> ParticleTypes.TOTEM_OF_UNDYING;
        };
    }

    public static void registerTotemPop(String playerName) {
        totemPops.put(playerName, totemPops.getOrDefault(playerName, 0) + 1);
        addNotification("§e" + playerName + " §fвзорвал тотем! (Всего: §c" + totemPops.get(playerName) + "§f)");
        addKillFeedMessage("§e" + playerName + " §7взорвал тотем!");
    }

    public static void registerPearlCooldown() {
        pearlCooldownTicks = 300;
    }

    public static void registerHit() {
        comboHits++;
        if (comboHits > maxComboSession) {
            maxComboSession = comboHits;
        }
        lastComboTime = System.currentTimeMillis();
        hitMarkerTimer = 10;
    }

    public static void registerLeftClick() { leftClicks++; }
    public static void registerRightClick() { rightClicks++; }

    public static void addNotification(String msg) {
        notifications.add(new Notification(msg, 3000));
    }

    public static void addKillFeedMessage(String msg) {
        if (localKillFeed.size() > 4) {
            localKillFeed.remove(0);
        }
        localKillFeed.add(msg);
    }

    // ==========================================
    // РЕНДЕР МОДУЛЕЙ И ИНТЕРФЕЙСОВ
    // ==========================================

    private void renderLowHpVignette(DrawContext context, MinecraftClient client) {
        int w = context.getScaledWindowWidth();
        int h = context.getScaledWindowHeight();
        context.fill(0, 0, w, 4, 0xBBFF0000);
        context.fill(0, h - 4, w, h, 0xBBFF0000);
        context.fill(0, 0, 4, h, 0xBBFF0000);
        context.fill(w - 4, 0, w, h, 0xBBFF0000);
    }

    private void renderPearlCooldownHUD(DrawContext context, TextRenderer tr, MinecraftClient client) {
        int cx = context.getScaledWindowWidth() / 2 - 110;
        int cy = context.getScaledWindowHeight() - 50;
        float seconds = pearlCooldownTicks / 20.0f;
        String str = String.format("🔮 Жемчуг: %.1fs", seconds);

        context.fill(cx, cy, cx + tr.getWidth(str) + 12, cy + 16, 0xD00F1118);
        context.fill(cx, cy, cx + tr.getWidth(str) + 12, cy + 2, 0xFFA855F7);
        context.drawText(tr, str, cx + 6, cy + 4, 0xFFA855F7, true);
    }

    private void renderTNTFuse(MatrixStack matrices, TntEntity tnt, Vec3d camPos, TextRenderer tr) {
        double x = tnt.getX() - camPos.x;
        double y = tnt.getY() + 1.2 - camPos.y;
        double z = tnt.getZ() - camPos.z;

        float seconds = tnt.getFuse() / 20.0f;
        String str = String.format("%.2fs", seconds);

        matrices.push();
        matrices.translate(x, y, z);
        matrices.scale(-0.025f, -0.025f, 0.025f);
        matrices.pop();
    }

