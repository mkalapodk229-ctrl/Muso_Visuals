    private void renderRadarHUD(DrawContext context, TextRenderer tr, MinecraftClient client) {
        int size = 64;
        int x = context.getScaledWindowWidth() - size - 15;
        int y = context.getScaledWindowHeight() - size - 20;
        context.fill(x, y, x + size, y + size, 0xD00F1118);
        context.fill(x, y, x + size, y + 2, 0xFF00E5FF);
        int cx = x + size / 2; int cy = y + size / 2;
        context.fill(cx - 1, cy - 1, cx + 2, cy + 2, 0xFFFF9800);

        for (PlayerEntity p : client.world.getPlayers()) {
            if (p != client.player) {
                double dx = (p.getX() - client.player.getX()) * 0.8;
                double dz = (p.getZ() - client.player.getZ()) * 0.8;
                if (Math.abs(dx) < size / 2 && Math.abs(dz) < size / 2) {
                    context.fill((int)(cx + dx) - 1, (int)(cy + dz) - 1, (int)(cx + dx) + 2, (int)(cy + dz) + 2, 0xFFFF5555);
                }
            }
        }
    }

    private void renderInventoryHUD(DrawContext context, TextRenderer tr, MinecraftClient client) {
        int startX = context.getScaledWindowWidth() - 170;
        int startY = context.getScaledWindowHeight() - 120;
        context.fill(startX - 5, startY - 5, startX + 162, startY + 58, 0xC00F1118);
        context.fill(startX - 5, startY - 5, startX + 162, startY - 3, 0xFFFF9800);

        for (int i = 9; i < 27; i++) {
            ItemStack stack = client.player.getInventory().getStack(i);
            int slotX = startX + ((i - 9) % 9) * 18;
            int slotY = startY + ((i - 9) / 9) * 18;
            context.fill(slotX, slotY, slotX + 16, slotY + 16, 0x40FFFFFF);
            if (!stack.isEmpty()) context.drawItem(stack, slotX, slotY);
        }
    }

