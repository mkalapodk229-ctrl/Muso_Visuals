name: Build MusoVisuals Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Fabric Template
        run: |
          curl -L -o template.zip https://github.com/FabricMC/fabric-example-mod/archive/refs/heads/1.21.zip
          unzip template.zip
          cp -r fabric-example-mod-1.21/* .
          chmod +x gradlew

      - name: Build Mod Jar
        run: ./gradlew build -x test

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: MusoVisuals-1.21.1
          path: build/libs/*.jar
