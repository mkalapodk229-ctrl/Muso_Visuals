    private void renderTargetHUD(DrawContext context, TextRenderer tr, MinecraftClient client) {
        if (!(client.targetedEntity instanceof PlayerEntity target)) return;
        int x = context.getScaledWindowWidth() / 2 + 20;
        int y = context.getScaledWindowHeight() / 2 + 20;
        String name = target.getName().getString();
        float hp = target.getHealth(); float maxHp = target.getMaxHealth();

        context.fill(x, y, x + 135, y + 38, 0xE00F1118);
        context.fill(x, y, x + 135, y + 3, 0xFFFF9800);
        context.drawText(tr, "⚔ " + name, x + 8, y + 8, 0xFFFFFFFF, true);

        int barWidth = (int) ((hp / maxHp) * 119);
        context.fill(x + 8, y + 23, x + 127, y + 29, 0xFF333333);
        context.fill(x + 8, y + 23, x + 8 + barWidth, y + 29, 0xFFFF5555);
        context.drawText(tr, (int) hp + " HP", x + 55, y + 23, 0xFFFFFFFF, true);
    }

    private void renderNotifications(DrawContext context, TextRenderer tr, MinecraftClient client) {
        int y = 10;
        int right = context.getScaledWindowWidth() - 10;
        for (Notification n : notifications) {
            int w = tr.getWidth(n.message) + 16;
            context.fill(right - w, y, right, y + 18, 0xE00F1118);
            context.fill(right - 3, y, right, y + 18, 0xFFFF9800);
            context.drawText(tr, n.message, right - w + 8, y + 5, 0xFFFFFFFF, true);
            y += 22;
        }
    }

    private void renderHalo(PlayerEntity player) {
        double radius = 0.35;
        for (int i = 0; i < 12; i++) {
            double angle = 2 * Math.PI * i / 12;
            player.getWorld().addParticle(
                    ParticleTypes.END_ROD,
                    player.getX() + Math.cos(angle) * radius,
                    player.getY() + player.getHeight() + 0.2,
                    player.getZ() + Math.sin(angle) * radius,
                    0, 0, 0
            );
        }
    }

    private void renderWings(PlayerEntity player) {
        if (player.getVelocity().lengthSquared() > 0.01) {
            player.getWorld().addParticle(
                    ParticleTypes.FLAME,
                    player.getX() - Math.sin(Math.toRadians(player.bodyYaw)) * 0.3,
                    player.getY() + 1.2,
                    player.getZ() + Math.cos(Math.toRadians(player.bodyYaw)) * 0.3,
                    0, 0.02, 0
            );
        }
    }

    private static class Notification {
        String message;
        long expireTime;

        Notification(String message, long duration) {
            this.message = message;
            this.expireTime = System.currentTimeMillis() + duration;
        }

        boolean isExpired() {
            return System.currentTimeMillis() > expireTime;
        }
    }
}
